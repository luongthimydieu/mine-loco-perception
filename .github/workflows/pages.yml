name: Deploy project page

# Manual-only by default: the live page is deployed via the personal Pages repo
# (https://jinnn.xyz/mine-loco/). Enable Pages in Settings → Pages and run this
# workflow manually if you also want a github.io preview.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Requires Pages to be enabled for this repository (Settings → Pages).
          # enablement: true attempts to enable it automatically when the token allows.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
